# One Render service running TWO personal projects: fda-bot (this repo's
# original app) and finresearch (github.com/otxengine/finresearch — merged
# in here so it doesn't need its own paid Render service). See
# backend/finresearch_mount.py for how: fda-bot's own FastAPI app mounts a
# reverse proxy at /finresearch (HTTP + WebSocket) in front of finresearch's
# Streamlit process, and launches finresearch's own scheduler as a second
# subprocess. startCommand below is unchanged from fda-bot-only — the
# mounting/subprocess launching all happens inside backend/main.py's own
# startup, not here.
#
# ⚠️ finresearch has no authentication of any kind (it was built for
# localhost-only use). Mounted here, /finresearch is reachable by anyone who
# finds this service's public URL — a deliberate, informed choice, not an
# oversight; see finresearch's own README.md.
services:
  - type: web
    name: fda-options-scanner
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: fda-scanner-db
      mountPath: /data
      # Bumped 1GB -> 2GB: this disk now also holds finresearch's own
      # SQLite database (FINRESEARCH_DB_PATH below) alongside fda-bot's.
      sizeGB: 2
    envVars:
      # ── fda-bot ──────────────────────────────────────────────────────────
      - key: DB_PATH
        value: /data/fda_scanner.db
      - key: POLYGON_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # BiopharmCatalyst authenticated v1 API key — see
      # backend/scrapers/biopharmcatalyst.py. Without it, scrape_biopharmcatalyst()
      # falls back to BPC's unauthenticated public endpoint.
      - key: BPC_API_KEY
        sync: false
      - key: SCANNER_API_URL
        value: https://fda-bot.onrender.com
      # ── finresearch ──────────────────────────────────────────────────────
      - key: FINRESEARCH_DB_PATH
        value: /data/finresearch.db
      - key: FRED_API_KEY
        sync: false
      - key: BLS_API_KEY
        sync: false
      - key: BEA_API_KEY
        sync: false
      # Phase 3, optional, off by default (finresearch's config/connectors.yaml)
      - key: NASDAQ_DATA_LINK_API_KEY
        sync: false
      - key: BENZINGA_API_KEY
        sync: false
      # ── shared by both apps ─────────────────────────────────────────────
      # fda-bot's learning engine + negative-event scanner (backend/signals/
      # learning_engine.py) AND finresearch's Chat page both use this same
      # key, if set. Leave blank to disable finresearch's Chat page rather
      # than have it error; fda-bot's learning features degrade gracefully
      # without it too (see that module's own fallback behavior).
      - key: ANTHROPIC_API_KEY
        sync: false
