services:
  - type: web
    name: fda-options-scanner
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: fda-scanner-db
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: DB_PATH
        value: /data/fda_scanner.db
      - key: POLYGON_API_KEY
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # BiopharmCatalyst authenticated v1 API key — was already set manually
      # in the Render dashboard but undeclared here (see
      # backend/scrapers/biopharmcatalyst.py). Without it, scrape_biopharmcatalyst()
      # silently falls back to BPC's unauthenticated public endpoint (10
      # events only, vs. unlimited with a key) — declaring it here just
      # documents that this env var exists and is required, sync: false so
      # this file never overwrites the value already set on Render.
      - key: BPC_API_KEY
        sync: false
      # Optional — deepens the macro risk-off read in backend/data/macro_context.py
      # with the 10Y-2Y yield curve. The VIX-based sector/macro context signal
      # (backend/data/macro_context.py) works fully without this — it only
      # needs yfinance, already a dependency. Free key from fred.stlouisfed.org
      # (the same one finresearch uses, if the user wants to reuse it).
      - key: FRED_API_KEY
        sync: false
      - key: SCANNER_API_URL
        value: https://fda-bot.onrender.com
